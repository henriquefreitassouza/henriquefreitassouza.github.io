# Runs every quality gate on pull requests. The same gates run again before each deploy.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Drafts are included here so the component demo post is tested; they are never deployed.
      - run: pnpm generate
        env:
          INCLUDE_DRAFTS: '1'
      - run: pnpm validate:html
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
